name: cd-support

on:
    push:
        branches:
            - develop
            - main

jobs:
    quality:
        uses: ./.github/workflows/ci.yml

    deploy-homolog:
        needs: quality
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/develop'
        env:
            HML_SSH_HOST: ${{ secrets.HML_SSH_HOST }}
            HML_SSH_PORT: ${{ secrets.HML_SSH_PORT }}
            HML_SSH_USER: ${{ secrets.HML_SSH_USER }}
            HML_PRIVATE_KEY: ${{ secrets.HML_PRIVATE_KEY }}
            HML_MS_FOLDER_PATH: ${{ secrets.HML_MS_FOLDER_PATH }}

        steps:
            - name: Validate homolog deployment configuration
              shell: bash
              run: |
                  set -euo pipefail
                  missing=()
                  for variable_name in HML_SSH_HOST HML_SSH_PORT HML_SSH_USER HML_PRIVATE_KEY HML_MS_FOLDER_PATH; do
                    if [ -z "${!variable_name:-}" ]; then
                      missing+=("$variable_name")
                    fi
                  done
                  if [ "${#missing[@]}" -gt 0 ]; then
                    echo "Missing homolog deployment secrets: ${missing[*]}"
                    exit 1
                  fi

            - name: Deploy to homolog server
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.HML_SSH_HOST }}
                  port: ${{ secrets.HML_SSH_PORT }}
                  username: ${{ secrets.HML_SSH_USER }}
                  key: ${{ secrets.HML_PRIVATE_KEY }}
                  script_stop: true
                  script: |
                      set -eu
                      cd ${{ secrets.HML_MS_FOLDER_PATH }}
                      echo "📥 Fazendo pull da branch develop..."
                      git fetch origin
                      git checkout develop
                      git pull origin develop
                      echo "🛑 Parando containers..."
                      docker compose -f docker-compose.yaml down
                      echo "🔨 Buildando e subindo containers..."
                      docker compose -f docker-compose.yaml up -d --build
                      echo "✅ Deploy concluído!"
                      docker compose -f docker-compose.yaml ps

    deploy-production:
        needs: quality
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        env:
            PRD_SSH_HOST: ${{ secrets.PRD_SSH_HOST }}
            PRD_SSH_PORT: ${{ secrets.PRD_SSH_PORT }}
            PRD_SSH_USER: ${{ secrets.PRD_SSH_USER }}
            PRD_PRIVATE_KEY: ${{ secrets.PRD_PRIVATE_KEY }}
            PRD_MS_FOLDER_PATH: ${{ secrets.PRD_MS_FOLDER_PATH }}

        steps:
            - name: Validate production deployment configuration
              shell: bash
              run: |
                  set -euo pipefail
                  missing=()
                  for variable_name in PRD_SSH_HOST PRD_SSH_PORT PRD_SSH_USER PRD_PRIVATE_KEY PRD_MS_FOLDER_PATH; do
                    if [ -z "${!variable_name:-}" ]; then
                      missing+=("$variable_name")
                    fi
                  done
                  if [ "${#missing[@]}" -gt 0 ]; then
                    echo "Missing production deployment secrets: ${missing[*]}"
                    exit 1
                  fi

            - name: Deploy to production server
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.PRD_SSH_HOST }}
                  port: ${{ secrets.PRD_SSH_PORT }}
                  username: ${{ secrets.PRD_SSH_USER }}
                  key: ${{ secrets.PRD_PRIVATE_KEY }}
                  script_stop: true
                  script: |
                      set -eu
                      cd ${{ secrets.PRD_MS_FOLDER_PATH }}
                      echo "📥 Fazendo pull da branch main..."
                      git fetch origin
                      git checkout main
                      git pull origin main
                      echo "🛑 Parando containers..."
                      docker compose -f docker-compose.yaml down
                      echo "🔨 Buildando e subindo containers..."
                      docker compose -f docker-compose.yaml up -d --build
                      echo "✅ Deploy concluído!"
                      docker compose -f docker-compose.yaml ps
