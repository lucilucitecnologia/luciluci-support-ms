name: ci

on:
    pull_request:
    # Push em develop/main roda este workflow via cd.yml, antes do deploy.
    workflow_call:

jobs:
    quality:
        runs-on: ubuntu-latest
        env:
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            DB_USER: postgres
            DB_PASSWORD: postgres
            DB_NAME: support_ms
            TEST_DB_NAME: support_ms_test
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U postgres"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run build
            - run: npm run build:check
            - name: Prove RF01 migrations, PostgreSQL persistence, and process startup
              run: |
                  S1_PROOF_DB_HOST=127.0.0.1 \
                  S1_PROOF_DB_PORT=5432 \
                  S1_PROOF_DB_USER=postgres \
                  S1_PROOF_DB_PASSWORD=postgres \
                  S1_PROOF_ADMIN_DB=postgres \
                  S1_PROOF_DB_NAME="support_s1_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
                  S1_PROOF_SERVER_PORT=3310 \
                  npm run proof:rf01:postgres
            - name: Prove RF02 update, locking, atomicity, and compiled process
              run: |
                  S1_PROOF_DB_HOST=127.0.0.1 \
                  S1_PROOF_DB_PORT=5432 \
                  S1_PROOF_DB_USER=postgres \
                  S1_PROOF_DB_PASSWORD=postgres \
                  S1_PROOF_ADMIN_DB=postgres \
                  S1_PROOF_DB_NAME="support_s1_ci_rf02_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
                  S1_PROOF_SERVER_PORT=3311 \
                  npm run proof:rf02:postgres
            - name: Prove RF03 pagination, ordering, and compiled process
              run: |
                  S1_PROOF_DB_HOST=127.0.0.1 \
                  S1_PROOF_DB_PORT=5432 \
                  S1_PROOF_DB_USER=postgres \
                  S1_PROOF_DB_PASSWORD=postgres \
                  S1_PROOF_ADMIN_DB=postgres \
                  S1_PROOF_DB_NAME="support_s1_ci_rf03_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
                  S1_PROOF_SERVER_PORT=3312 \
                  npm run proof:rf03:postgres
            - name: Prove RF04 soft delete, locking, and compiled process
              run: |
                  S1_PROOF_DB_HOST=127.0.0.1 \
                  S1_PROOF_DB_PORT=5432 \
                  S1_PROOF_DB_USER=postgres \
                  S1_PROOF_DB_PASSWORD=postgres \
                  S1_PROOF_ADMIN_DB=postgres \
                  S1_PROOF_DB_NAME="support_s1_ci_rf04_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
                  S1_PROOF_SERVER_PORT=3313 \
                  npm run proof:rf04:postgres
            - name: Prove RF05 ticket creation, rollback, and concurrency
              run: |
                  S1_PROOF_DB_HOST=127.0.0.1 \
                  S1_PROOF_DB_PORT=5432 \
                  S1_PROOF_DB_USER=postgres \
                  S1_PROOF_DB_PASSWORD=postgres \
                  S1_PROOF_ADMIN_DB=postgres \
                  S1_PROOF_DB_NAME="support_s1_ci_rf05_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
                  S1_PROOF_SERVER_PORT=3314 \
                  npm run proof:rf05:postgres
            - name: Prove RF06 ticket update, ACL, audit, rollback, and locks
              run: |
                  S1_PROOF_DB_HOST=127.0.0.1 \
                  S1_PROOF_DB_PORT=5432 \
                  S1_PROOF_DB_USER=postgres \
                  S1_PROOF_DB_PASSWORD=postgres \
                  S1_PROOF_ADMIN_DB=postgres \
                  S1_PROOF_DB_NAME="support_s1_ci_rf06_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
                  S1_PROOF_SERVER_PORT=3315 \
                  npm run proof:rf06:postgres
            - name: Prove RF07 requester/admin listings, ACL, filters, and read-only behavior
              run: |
                  S1_PROOF_DB_HOST=127.0.0.1 \
                  S1_PROOF_DB_PORT=5432 \
                  S1_PROOF_DB_USER=postgres \
                  S1_PROOF_DB_PASSWORD=postgres \
                  S1_PROOF_ADMIN_DB=postgres \
                  S1_PROOF_DB_NAME="support_s1_ci_rf07_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
                  S1_PROOF_SERVER_PORT=3316 \
                  npm run proof:rf07:postgres
            - name: Prove RF08 requester resolution, rollback, no-op, and Ticket locks
              run: |
                  S1_PROOF_DB_HOST=127.0.0.1 \
                  S1_PROOF_DB_PORT=5432 \
                  S1_PROOF_DB_USER=postgres \
                  S1_PROOF_DB_PASSWORD=postgres \
                  S1_PROOF_ADMIN_DB=postgres \
                  S1_PROOF_DB_NAME="support_s1_ci_rf08_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
                  S1_PROOF_SERVER_PORT=3317 \
                  npm run proof:rf08:postgres
            - name: Prove RF09 Ticket detail, current ACL, and physical read-only behavior
              run: |
                  S1_PROOF_DB_HOST=127.0.0.1 \
                  S1_PROOF_DB_PORT=5432 \
                  S1_PROOF_DB_USER=postgres \
                  S1_PROOF_DB_PASSWORD=postgres \
                  S1_PROOF_ADMIN_DB=postgres \
                  S1_PROOF_DB_NAME="support_s1_ci_rf09_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
                  S1_PROOF_SERVER_PORT=3318 \
                  npm run proof:rf09:postgres
            - name: Prove RF10 Ticket messages, rollback, audits, and Ticket locks
              run: |
                  S1_PROOF_DB_HOST=127.0.0.1 \
                  S1_PROOF_DB_PORT=5432 \
                  S1_PROOF_DB_USER=postgres \
                  S1_PROOF_DB_PASSWORD=postgres \
                  S1_PROOF_ADMIN_DB=postgres \
                  S1_PROOF_DB_NAME="support_s1_ci_rf10_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
                  S1_PROOF_SERVER_PORT=3319 \
                  npm run proof:rf10:postgres
            - name: Prove RF11 message visibility, physical no-op, rollback, and locks
              run: |
                  S1_PROOF_DB_HOST=127.0.0.1 \
                  S1_PROOF_DB_PORT=5432 \
                  S1_PROOF_DB_USER=postgres \
                  S1_PROOF_DB_PASSWORD=postgres \
                  S1_PROOF_ADMIN_DB=postgres \
                  S1_PROOF_DB_NAME="support_s1_ci_rf11_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
                  S1_PROOF_SERVER_PORT=3320 \
                  npm run proof:rf11:postgres
            - name: Prove RF12 message list, scope, read-only snapshot, and concurrency
              run: |
                  S1_PROOF_DB_HOST=127.0.0.1 \
                  S1_PROOF_DB_PORT=5432 \
                  S1_PROOF_DB_USER=postgres \
                  S1_PROOF_DB_PASSWORD=postgres \
                  S1_PROOF_ADMIN_DB=postgres \
                  S1_PROOF_DB_NAME="support_s1_ci_rf12_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
                  S1_PROOF_SERVER_PORT=3321 \
                  npm run proof:rf12:postgres
            - name: Prove RF13 scoped Ticket history, read-only snapshot, and concurrency
              run: |
                  S1_PROOF_DB_HOST=127.0.0.1 \
                  S1_PROOF_DB_PORT=5432 \
                  S1_PROOF_DB_USER=postgres \
                  S1_PROOF_DB_PASSWORD=postgres \
                  S1_PROOF_ADMIN_DB=postgres \
                  S1_PROOF_DB_NAME="support_s1_ci_rf13_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
                  S1_PROOF_SERVER_PORT=3322 \
                  npm run proof:rf13:postgres
            - name: Prove W1 deterministic seed, safety, rollback, and HTTP reads
              run: |
                  S1_PROOF_DB_HOST=127.0.0.1 \
                  S1_PROOF_DB_PORT=5432 \
                  S1_PROOF_DB_USER=postgres \
                  S1_PROOF_DB_PASSWORD=postgres \
                  S1_PROOF_ADMIN_DB=postgres \
                  S1_PROOF_DB_NAME="support_s1_ci_seed_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
                  S1_PROOF_SERVER_PORT=3323 \
                  npm run proof:seed:w1:postgres
            - name: Smoke the production image and its CMD against isolated PostgreSQL
              run: npm run proof:s1:image
            - run: npm run openapi:export
            - name: Check OpenAPI artifact sync
              run: git diff --exit-code docs/openapi/v1/support-api.json
            - run: npm run openapi:check
            - name: Check OpenAPI backward compatibility
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    git fetch origin "${{ github.base_ref }}" --depth=1
                    if git cat-file -e FETCH_HEAD:docs/openapi/v1/support-api.json 2>/dev/null; then
                      git show FETCH_HEAD:docs/openapi/v1/support-api.json > /tmp/support-api-baseline.json
                      npm run openapi:compat -- /tmp/support-api-baseline.json docs/openapi/v1/support-api.json
                    else
                      echo "No OpenAPI baseline found on base branch; skipping backward compatibility check."
                    fi
                  elif git cat-file -e HEAD^:docs/openapi/v1/support-api.json 2>/dev/null; then
                    git show HEAD^:docs/openapi/v1/support-api.json > /tmp/support-api-baseline.json
                    npm run openapi:compat -- /tmp/support-api-baseline.json docs/openapi/v1/support-api.json
                  else
                    echo "No OpenAPI baseline found; skipping backward compatibility check."
                  fi
            - run: npm run messaging:check
            - run: npm run test:coverage
            - run: npm run coverage:check
